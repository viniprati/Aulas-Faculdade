<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Funções para Vetores</title>
</head>
<body>
    <p>
        Opções:
        <select id="sltOpcoes">
            <option value="" selected disabled>Selecione a operação</option>
            <option value="MOSTRAR">Mostrar</option>
            <option value="INCLUIR">Incluir</option>
            <option value="EXCLUIR">Excluir</option>
            <option value="ALTERAR">Alterar</option>
            <option value="PROCURAR">Procurar</option>
            <option value="SOMAR">Somar</option>
            <option value="MENOR">Menor</option>
            <option value="MAIOR">Maior</option>
            <option value="MEDIA">Média</option>
            <option value="ORDENAR">Ordenar</option>
        </select>
    </p>
    <p>Valor:<input type="number" id="inValor"></p>
    <p>Posição:<input type="number" id="inPosicao"></p>
    <button id="btExecutar">Executar</button>

    <h3 id="outSaida"></h3>
    <script src="script.js"></script>
</body>
</html>
